<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 200 200" version="1.1" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <mask id="gapMask" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="200" height="200" fill="white"/>
      <rect x="130" y="82" width="50" height="18" rx="4" fill="black" transform="rotate(45 100 90)"/>
    </mask>
    <filter id="tailGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="90" r="52" fill="none" stroke="#39FF7A" stroke-width="16" mask="url(#gapMask)"/>
  <rect x="134" y="84" width="46" height="14" rx="7" fill="#A45EFF" filter="url(#tailGlow)" transform="rotate(45 100 90)"/>
</svg>
